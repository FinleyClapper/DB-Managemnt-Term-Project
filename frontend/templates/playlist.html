{% extends "base.html" %}

{% block content %}
<h2>Create a Playlist</h2>

<!-- Playlist creation form -->
<form method="POST" class="form-container">
    <label for="name">Playlist Name:</label>
    <input type="text" id="name" name="name" placeholder="Enter playlist name" required>
    <button type="submit" class="btn">Create Playlist</button>
</form>

<hr>

<!-- Songs list --
<h3>Available Songs{% if selected_genre %} ({{ selected_genre }}){% endif %}</h3>
<table>
    <tr>
        <th>Select</th>
        <th>Track Name</th>
        <th>Artist</th>
        <th>Genre</th>
    </tr>
    {% for song in songs %}
    <tr>
        <td><input type="checkbox" name="songs" value="{{ song.track_name }}"></td>
        <td>{{ song.track_name }}</td>
        <td>{{ song.artists }}</td>
        <td>{{ song.track_genre }}</td>
    </tr>
    {% endfor %}
</table>

<hr>
-->
<!-- Saved playlists -->
<h3>Your Playlists</h3>
<ul>
    {% for pl in playlists %}
    <li style="margin-bottom:8px">
        <strong>{{ pl.name }}</strong> — <span class="muted">{{ pl.song_count or 0 }} songs</span>
        <div style="display:inline-block;margin-left:12px">
            <a class="btn" href="{{ url_for('edit_playlist', playlist_id=pl.id) }}">Edit</a>
            <form method="POST" action="{{ url_for('delete_playlist', playlist_id=pl.id) }}" style="display:inline-block;margin-left:6px">
                <button class="btn secondary" type="submit">Delete</button>
            </form>
        </div>
    </li>
    {% else %}
    <li>No playlists yet. Create one above!</li>
    {% endfor %}
</ul>
{% endblock %}
