{% extends "base.html" %}

{% block content %}
<div class="glass-card auth-container">
    <h2>Account Settings</h2>
    <form method="POST">
        <label for="full_name">Full name</label>
        <input type="text" id="full_name" name="full_name" value="{{ full_name or '' }}" placeholder="Your display name">

        <label for="favorites">Top 4 Favorite Songs</label>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
            {% for i in range(1,5) %}
                <div style="flex:1;min-width:140px">
                    <div class="select-search-wrap">
                        <input class="select-filter" data-target="fav_select_{{ i }}" placeholder="Search songs..." />
                        <select id="fav_select_{{ i }}" name="favorite_{{ i }}" class="black-select">
                            <option value="">(no selection)</option>
                            {% for s in song_options %}
                                <option value="{{ s.row_id }}" {% if favorites and favorites|length >= i and favorites[i-1] == s.row_id %}selected{% endif %}>{{ s.label }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
            {% endfor %}
        </div>
        <label for="description">Profile Description</label>
        <textarea id="description" name="description" rows="4" style="width:100%;border-radius:8px;padding:10px;">{{ description or '' }}</textarea>

        <div class="row" style="justify-content:flex-end;">
            <button type="submit" class="btn">Save Changes</button>
        </div>
    </form>
    <p style="margin-top:12px;" class="muted">This description appears on your account page.</p>
</div>

{% endblock %}
