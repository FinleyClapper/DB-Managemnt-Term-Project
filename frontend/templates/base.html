<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rhythmix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="{{ url_for('static', filename='app.js') }}"></script>
</head>
<body>
    <div class="site-bg">
        <img class="bg-decor" src="{{ url_for('static', filename='bg-abstract.svg') }}" alt="decorative background">
    </div>

    <header class="topbar">
        <div class="brand">
            <div class="logo">R</div>
            <div class="brand-text">
                <span class="title">RHYTHMIX</span>
                <small class="tag">Discover • Organize • Play</small>
            </div>
        </div>

        <nav class="nav">
            <div class="nav-left">
                <a href="{{ url_for('index') }}">Home</a>
                <a href="{{ url_for('discover') }}">Discover</a>
                <a href="{{ url_for('search') }}">Search</a>
                <a href="{{ url_for('playlist') }}">Playlists</a>
            </div>
            <div class="nav-right">
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('account') }}">{{ current_user.username }}</a>
                    <a href="{{ url_for('logout') }}">Logout</a>
                {% else %}
                    <a href="{{ url_for('login') }}">Login</a>
                    <a href="{{ url_for('register') }}">Register</a>
                {% endif %}
            </div>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <div id="toast-container" style="position:fixed;right:20px;bottom:20px;z-index:9999"></div>

    <footer class="site-footer">
        <div class="footer-inner">
            <p>&copy; {{ current_year or 2025 }} Rhythmix. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
